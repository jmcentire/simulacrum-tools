<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Management Simulator — Simulacrum</title>
  <style>
    :root { --bg:#1a1a1a; --surface:#222; --surface-2:#262626; --text:#e8e8e8; --subtle:#8c8c8c; --border:#333; --accent:#ffb86c; --accent-text:#1a1a1a; --danger:#ff7b72; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { display:flex; align-items:center; gap:16px; padding:12px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
    h1 { font-size:16px; margin:0; font-weight:600; }
    nav { display:flex; gap:12px; margin-left:auto; font-size:13px; }
    nav a { color:var(--subtle); text-decoration:none; }
    nav a.active, nav a:hover { color:var(--text); }
    main { max-width:1180px; margin:0 auto; padding:24px; }
    .grid { display:grid; grid-template-columns:1.4fr .9fr; gap:18px; }
    .panel { border:1px solid var(--border); background:var(--surface); padding:16px; border-radius:6px; }
    .panel + .panel { margin-top:18px; }
    h2 { font-size:14px; margin:0 0 12px; }
    h3 { font-size:13px; margin:0 0 8px; }
    .muted { color:var(--subtle); font-size:13px; line-height:1.5; }
    .team { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .person { border:1px solid var(--border); background:var(--surface-2); padding:10px; border-radius:5px; }
    .person strong { display:block; font-size:13px; }
    .person small { color:var(--subtle); }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .tag { font-size:11px; color:var(--subtle); border:1px solid var(--border); padding:2px 6px; border-radius:999px; }
    .report { white-space:pre-wrap; font-size:13px; line-height:1.5; }
    textarea, input, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:9px; font:inherit; }
    textarea { min-height:80px; resize:vertical; }
    button { background:var(--accent); color:var(--accent-text); border:0; border-radius:4px; padding:9px 12px; font:inherit; font-weight:700; cursor:pointer; }
    button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > * { flex:1; min-width:160px; }
    .error { color:var(--danger); font-size:13px; }
    .metric { display:inline-block; margin-right:8px; font-size:12px; color:var(--subtle); }
    .score { font-size:20px; font-weight:700; }
    @media (max-width:840px) { .grid { grid-template-columns:1fr; } .team { grid-template-columns:1fr; } header { flex-wrap:wrap; } nav { margin-left:0; } }
  </style>
</head>
<body>
  <header>
    <h1>Management Simulator</h1>
    <nav>
      <a href="/simulator" class="active">Manager</a>
      <a href="/chat-ui">Simulacrum</a>
      <a href="/logout">Logout</a>
    </nav>
  </header>
  <main id="content"></main>
  <script>
    const content = document.getElementById('content');
    let run = null;
    let week = null;

    function esc(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(cents) { return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 }).format(cents / 100); }
    async function api(path, options = {}) {
      const response = await fetch(path, { credentials:'same-origin', ...options });
      if (response.status === 401) window.location = '/sign-in';
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
      return body;
    }

    function startView() {
      content.innerHTML = `
        <div class="panel" style="max-width:760px">
          <h2>Assess your management instincts</h2>
          <p class="muted">This is not a management quiz and it is not a checklist of best practices. You will be given a software engineering team, a product mission that is too large for the quarter, a fixed headcount budget, and incomplete information.</p>
          <p class="muted">Your job is to notice what matters, decide where to spend attention, shape the team, and live with the consequences. The simulator watches the patterns in your decisions and reports where your judgment aligned or misaligned with the people and the work.</p>
          <p class="muted">Each run starts from a randomly selected scenario. You do not choose the mission, the budget, or the initial team.</p>
          <div style="height:16px"></div>
          <button id="start">Start random scenario</button>
          <p id="error" class="error"></p>
        </div>`;
      document.getElementById('start').onclick = async () => {
        try {
          const data = await api('/api/management-sim/start', { method:'POST' });
          run = data.run;
          await loadWeek();
          render();
        } catch (err) { document.getElementById('error').textContent = err.message; }
      };
    }

    function teamCard(person) {
      const skills = Object.entries(person.skills).sort((a,b) => b[1] - a[1]).slice(0,3).map(([k,v]) => `<span class="tag">${esc(k)} ${v}</span>`).join('');
      const observations = (person.observations || []).slice(0,2).map(item => `<div class="muted">${esc(item)}</div>`).join('');
      return `<div class="person"><strong>${esc(person.name)}</strong><small>${esc(person.role)} · ${money(person.salary_cents)}</small><div class="tags">${skills}</div><div style="margin-top:8px">${observations || '<div class="muted">No new observation yet.</div>'}</div></div>`;
    }

    function reports() {
      return week.reports.map(report => `
        <div class="panel">
          <h3>${esc(report.name)} · ${esc(report.role)}</h3>
          <div class="report">${esc(report.report_text)}</div>
          <div class="tags">${(report.observations || []).map(item => `<span class="tag">${esc(item)}</span>`).join('')}</div>
          <div style="height:12px"></div>
          <textarea id="message-${esc(report.persona_id)}" placeholder="What do you say in the 1:1?"></textarea>
          <div style="height:8px"></div>
          <button class="secondary" data-persona="${esc(report.persona_id)}">Send 1:1 message</button>
          <div id="reply-${esc(report.persona_id)}" class="muted" style="margin-top:8px"></div>
        </div>`).join('');
    }

    function inboxPanel() {
      const inbox = week.artifact_inbox || [];
      const attention = run.attention || { remaining: 0, budget: 0 };
      return `
        <div class="panel">
          <h2>Inbox · Attention ${attention.remaining}/${attention.budget}</h2>
          <p class="muted">You cannot investigate everything. Open the traces that matter, then decide what remains unexamined.</p>
          ${inbox.map(item => `
            <div style="border-top:1px solid var(--border); padding-top:10px; margin-top:10px">
              <div class="muted"><strong>${esc(item.channel)}</strong> · ${esc(item.title)}</div>
              <div class="muted" style="margin-top:4px">${esc(item.preview)}</div>
              ${item.revealed ? `<div class="report" style="margin-top:8px">${esc(item.detail)}</div>` : `<button class="secondary investigate-artifact" data-artifact="${esc(item.id)}" style="margin-top:8px">Investigate</button>`}
            </div>`).join('')}
        </div>`;
    }

    function workPanel() {
      const workstreams = week.workstreams || [];
      return `
        <div class="panel">
          <h2>Work In Flight</h2>
          <p class="muted">This is what the team says is moving. It does not tell you why something is stuck.</p>
          ${workstreams.map(item => `
            <div style="border-top:1px solid var(--border); padding-top:8px; margin-top:8px">
              <div class="muted"><strong>${esc(item.title)}</strong> · ${esc(item.owner)}</div>
              <div class="muted">${esc(item.state)} · ${item.completion}%</div>
            </div>`).join('')}
        </div>`;
    }

    function trackingPanel() {
      const choices = [
        ['delivery', 'Delivery'],
        ['quality', 'Quality'],
        ['team_health', 'Team health'],
        ['retention', 'Retention'],
        ['customer_impact', 'Customer impact'],
      ];
      return `
        <div class="panel">
          <h2>What Are You Tracking?</h2>
          <p class="muted">Choose up to three signals. The simulator will only surface evidence in the areas you decide to watch.</p>
          ${choices.map(([id, label]) => `<label class="muted" style="display:block;margin:6px 0"><input type="checkbox" class="tracking-choice" value="${id}" ${run.tracking_focus.includes(id) ? 'checked' : ''}> ${label}</label>`).join('')}
          <div style="height:10px"></div>
          <button class="secondary" id="save-tracking">Save tracking focus</button>
          <p id="tracking-error" class="error"></p>
        </div>`;
    }

    function notebookPanel() {
      const due = week.reports_due || {};
      return `
        <div class="panel">
          <h2>Manager Notebook</h2>
          <p class="muted">Write what you observed, what you think is true, what you will do, and what you expect to happen before the next simulated week runs.</p>
          <label class="muted">Observations</label>
          <textarea id="journal-observations" placeholder="What concrete behavior or evidence did you notice?"></textarea>
          <div style="height:8px"></div>
          <label class="muted">Hypotheses</label>
          <textarea id="journal-hypotheses" placeholder="What do you think is causing it?"></textarea>
          <div style="height:8px"></div>
          <label class="muted">Questions</label>
          <textarea id="journal-questions" placeholder="What do you still need to know?"></textarea>
          <div style="height:8px"></div>
          <label class="muted">Decision</label>
          <textarea id="journal-decision" placeholder="What will you do or not do?"></textarea>
          <div style="height:8px"></div>
          <label class="muted">What would change your mind?</label>
          <textarea id="journal-change-mind" placeholder="What evidence would make you revise this?"></textarea>
          <div style="height:10px"></div>
          <h3>One Prediction</h3>
          <div class="row">
            <select id="prediction-subject">
              <option value="team">Team</option>
              <option value="product">Product</option>
              ${run.team.map(person => `<option value="${esc(person.id)}">${esc(person.name)}</option>`).join('')}
            </select>
            <select id="prediction-outcome">
              <option value="energy">Energy</option>
              <option value="trust">Trust</option>
              <option value="quality">Quality</option>
              <option value="delivery">Delivery</option>
              <option value="risk">Risk</option>
            </select>
            <select id="prediction-direction">
              <option value="up">Up</option>
              <option value="down">Down</option>
              <option value="stable">Stable</option>
            </select>
          </div>
          <div style="height:8px"></div>
          <div class="row">
            <input id="prediction-confidence" type="number" min="20" max="95" value="60" placeholder="Confidence">
            <input id="prediction-rationale" placeholder="Why?">
          </div>
          <div style="height:10px"></div>
          <button id="submit-day-report" ${due.daily ? '' : 'disabled'}>${due.daily ? 'Submit end-of-day notebook' : 'Notebook submitted'}</button>
          ${due.weekly ? `
            <div style="height:14px"></div>
            <label class="muted">End-of-week project report</label>
            <textarea id="week-report" placeholder="What changed, what did you learn, what are you betting on now?"></textarea>
            <div style="height:8px"></div>
            <button class="secondary" id="submit-week-report">Submit project report</button>
          ` : ''}
          <p id="journal-error" class="error"></p>
        </div>`;
    }

    function milestonePanel() {
      const pool = week.candidate_pool;
      if (run.week === 2 && run.day_in_week >= 2 && run.day_in_week <= 5 && !week.milestones.week_2_reduction.applied) {
        return `
          <div class="panel">
            <h2>Reduction Decision</h2>
            <p class="muted">The budget cut requires two terminations. Choose the roles you are removing and live with the capability gap.</p>
            ${run.team.map(person => `<label class="muted" style="display:block;margin:8px 0"><input type="checkbox" class="termination-choice" value="${esc(person.id)}" ${week.milestones.week_2_reduction.selected_ids.includes(person.id) ? 'checked' : ''}> <strong>${esc(person.name)}</strong> · ${esc(person.role)} · ${money(person.salary_cents)}</label>`).join('')}
            <div style="height:8px"></div>
            <button class="secondary" id="select-terminations">Select two terminations</button>
            <p id="milestone-error" class="error"></p>
          </div>
          ${pool && pool.kind === 'week_2_backfill' ? `
            <div class="panel">
              <h2>Backfill Window</h2>
              <p class="muted">You may use one backfill slot after the reduction, or decline it and preserve headcount budget.</p>
              <select id="backfill-choice">
                <option value="">Decline backfill</option>
                ${pool.candidates.map(candidate => `<option value="${esc(candidate.id)}">${esc(candidate.name)} · ${esc(candidate.role)} · ${money(candidate.salary_cents)}</option>`).join('')}
              </select>
              <div style="height:8px"></div>
              <button id="choose-backfill">Choose backfill</button>
            </div>
          ` : ''}`;
      }
      if (!pool) return '';
      if (pool.kind === 'week_1_hire') {
        return `
          <div class="panel">
            <h2>Hiring Window</h2>
            <p class="muted">Choose two interviews on day 4. Choose one hire on day 5. The slot expires tonight.</p>
            ${pool.candidates.map(candidate => `<label class="muted" style="display:block;margin:8px 0"><input type="checkbox" class="interview-choice" value="${esc(candidate.id)}" ${pool.interview_ids.includes(candidate.id) ? 'checked' : ''}> <strong>${esc(candidate.name)}</strong> · ${esc(candidate.role)} · ${money(candidate.salary_cents)}</label>`).join('')}
            <div style="height:8px"></div>
            <button class="secondary" id="select-interviews" ${run.day === 4 ? '' : 'disabled'}>Select two interviews</button>
            ${pool.interview_ids.map(candidateId => {
              const candidate = pool.candidates.find(item => item.id === candidateId);
              const history = candidate?.interview_history || [];
              return `
                <div style="border-top:1px solid var(--border); padding-top:10px; margin-top:10px">
                  <div class="muted"><strong>${esc(candidate.name)}</strong> · ${esc(candidate.interview)}</div>
                  ${history.map(turn => `<div class="muted" style="margin-top:4px"><strong>${esc(turn.role)}</strong>: ${esc(turn.content)}</div>`).join('')}
                  <textarea id="candidate-message-${esc(candidate.id)}" placeholder="Ask a half-spec scenario, finishing work, conflict, details, or ownership."></textarea>
                  <div style="height:6px"></div>
                  <button class="secondary candidate-interview" data-candidate="${esc(candidate.id)}">Ask interview question</button>
                  <div id="candidate-reply-${esc(candidate.id)}" class="muted" style="margin-top:6px"></div>
                </div>`;
            }).join('')}
            <div style="height:10px"></div>
            <select id="hire-choice">${pool.candidates.filter(candidate => !pool.interview_ids.length || pool.interview_ids.includes(candidate.id)).map(candidate => `<option value="${esc(candidate.id)}">${esc(candidate.name)} · ${esc(candidate.role)}</option>`).join('')}</select>
            <div style="height:8px"></div>
            <button id="choose-hire" ${run.day === 5 ? '' : 'disabled'}>Choose hire</button>
            <p id="milestone-error" class="error"></p>
          </div>`;
      }
      return `
        <div class="panel">
          <h2>Backfill Window</h2>
          <p class="muted">You may use one backfill slot after the reduction, or decline it and preserve headcount budget.</p>
          <select id="backfill-choice">
            <option value="">Decline backfill</option>
            ${pool.candidates.map(candidate => `<option value="${esc(candidate.id)}">${esc(candidate.name)} · ${esc(candidate.role)} · ${money(candidate.salary_cents)}</option>`).join('')}
          </select>
          <div style="height:8px"></div>
          <button id="choose-backfill">Choose backfill</button>
          <p id="milestone-error" class="error"></p>
        </div>`;
    }

    function render() {
      content.innerHTML = `
        <div class="grid">
          <section>
            <div class="panel">
              <h2>Day ${run.day} · Week ${run.week} · ${esc(run.scenario?.title || 'Management Scenario')}</h2>
              <div class="muted"><strong>Mission:</strong> ${esc(run.mission)}</div>
              <div style="height:6px"></div>
              <div class="muted">${esc(run.scenario?.brief || '')}</div>
              <div style="height:8px"></div>
              <div class="muted"><strong>${esc(week.curriculum.title)}</strong> · ${esc(week.curriculum.goal)}</div>
              <div style="height:8px"></div>
              <div class="muted">${esc(week.curriculum.brief)}</div>
              <div style="height:10px"></div>
              <div class="metric">Headcount budget remaining ${money(run.cash_remaining_cents)}</div>
              <div class="metric">Weekly deliverable: ${esc(week.curriculum.deliverable)}</div>
              <div style="height:10px"></div>
              ${(week.world_events || []).map(event => `<div class="muted"><strong>${esc(event.title)}</strong><br>${esc(event.summary)}</div>`).join('')}
              ${(week.world_events || []).length ? '<div style="height:10px"></div>' : ''}
              ${(week.product_observations || []).map(item => `<div class="muted">${esc(item)}</div>`).join('')}
            </div>
            ${workPanel()}
            ${inboxPanel()}
            ${reports()}
          </section>
          <aside>
            <div class="panel">
              <h2>Team</h2>
              <div class="team">${run.team.map(teamCard).join('')}</div>
            </div>
            <div class="panel">
              <h2>Manager Action</h2>
              <p class="muted">Choose one person and one deliberate intervention. The effect is not visible immediately.</p>
              <label class="muted">Person</label>
              <select id="action-person">${run.team.map(person => `<option value="${esc(person.id)}">${esc(person.name)}</option>`).join('')}</select>
              <div style="height:8px"></div>
              <label class="muted">Action</label>
              <select id="action-kind">${week.actions.map(action => `<option value="${esc(action.id)}">${esc(action.label)}</option>`).join('')}</select>
              <div style="height:8px"></div>
              <label class="muted">Why</label>
              <textarea id="rationale" placeholder="What are you trying to change?"></textarea>
              <div style="height:10px"></div>
              <button id="apply-action">Commit action</button>
              <p id="action-error" class="error"></p>
            </div>
            ${trackingPanel()}
            ${milestonePanel()}
            ${notebookPanel()}
            <div class="panel">
              <h2>Hypervisor</h2>
              <button class="secondary" id="assessment">Request report</button>
              <div id="assessment-output" class="report" style="margin-top:12px"></div>
            </div>
            <div class="panel">
              <h2>Advance</h2>
              <p class="muted">This runs the team asynchronously for the next simulated week. You will see consequences, not the hidden state that caused them.</p>
              <button id="advance">Run next simulated week</button>
            </div>
          </aside>
        </div>`;

      document.querySelectorAll('[data-persona]').forEach(button => {
        button.onclick = async () => {
          const persona = button.dataset.persona;
          const message = document.getElementById(`message-${persona}`).value;
          const target = document.getElementById(`reply-${persona}`);
          target.textContent = '...';
          try {
            const data = await api(`/api/management-sim/dialogue/${persona}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ message }) });
            target.textContent = data.response_text;
          } catch (err) { target.textContent = err.message; }
        };
      });
      document.querySelectorAll('.investigate-artifact').forEach(button => {
        button.onclick = async () => {
          try {
            const data = await api('/api/management-sim/investigate', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ artifact_id:button.dataset.artifact }) });
            run = data.run;
            await loadWeek();
            render();
          } catch (err) { alert(err.message); }
        };
      });
      document.getElementById('apply-action').onclick = async () => {
        try {
          const data = await api('/api/management-sim/action', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ persona_id:document.getElementById('action-person').value, action:document.getElementById('action-kind').value, rationale:document.getElementById('rationale').value }) });
          run = data.run;
          await loadWeek();
          render();
        } catch (err) { document.getElementById('action-error').textContent = err.message; }
      };
      const saveTracking = document.getElementById('save-tracking');
      if (saveTracking) {
        saveTracking.onclick = async () => {
          try {
            const focus = [...document.querySelectorAll('.tracking-choice:checked')].map(item => item.value);
            const data = await api('/api/management-sim/tracking', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ focus }) });
            run = data.run;
            await loadWeek();
            render();
          } catch (err) { document.getElementById('tracking-error').textContent = err.message; }
        };
      }
      const submitJournal = document.getElementById('submit-day-report');
      if (submitJournal) {
        submitJournal.onclick = async () => {
          try {
            const payload = {
              observations: document.getElementById('journal-observations').value,
              hypotheses: document.getElementById('journal-hypotheses').value,
              questions: document.getElementById('journal-questions').value,
              decision: document.getElementById('journal-decision').value,
              change_mind: document.getElementById('journal-change-mind').value,
              predictions: [{
                subject: document.getElementById('prediction-subject').value,
                outcome: document.getElementById('prediction-outcome').value,
                direction: document.getElementById('prediction-direction').value,
                confidence: Number(document.getElementById('prediction-confidence').value),
                rationale: document.getElementById('prediction-rationale').value,
              }],
            };
            const data = await api('/api/management-sim/day-report', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
            run = data.run;
            await loadWeek();
            render();
          } catch (err) { document.getElementById('journal-error').textContent = err.message; }
        };
      }
      const submitWeekReport = document.getElementById('submit-week-report');
      if (submitWeekReport) {
        submitWeekReport.onclick = async () => {
          try {
            const data = await api('/api/management-sim/week-report', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ report:document.getElementById('week-report').value }) });
            run = data.run;
            await loadWeek();
            render();
          } catch (err) { document.getElementById('journal-error').textContent = err.message; }
        };
      }
      const selectInterviews = document.getElementById('select-interviews');
      if (selectInterviews) {
        selectInterviews.onclick = async () => {
          try {
            const candidate_ids = [...document.querySelectorAll('.interview-choice:checked')].map(item => item.value);
            const data = await api('/api/management-sim/interviews', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ candidate_ids }) });
            run = data.run;
            await loadWeek();
            render();
          } catch (err) { document.getElementById('milestone-error').textContent = err.message; }
        };
      }
      document.querySelectorAll('.candidate-interview').forEach(button => {
        button.onclick = async () => {
          const candidateId = button.dataset.candidate;
          const reply = document.getElementById(`candidate-reply-${candidateId}`);
          reply.textContent = '...';
          try {
            const data = await api(`/api/management-sim/candidate-interview/${candidateId}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ message:document.getElementById(`candidate-message-${candidateId}`).value }) });
            reply.textContent = data.response_text;
          } catch (err) { reply.textContent = err.message; }
        };
      });
      const chooseHire = document.getElementById('choose-hire');
      if (chooseHire) {
        chooseHire.onclick = async () => {
          try {
            const data = await api('/api/management-sim/hire', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ candidate_id:document.getElementById('hire-choice').value }) });
            run = data.run;
            await loadWeek();
            render();
          } catch (err) { document.getElementById('milestone-error').textContent = err.message; }
        };
      }
      const selectTerminations = document.getElementById('select-terminations');
      if (selectTerminations) {
        selectTerminations.onclick = async () => {
          try {
            const persona_ids = [...document.querySelectorAll('.termination-choice:checked')].map(item => item.value);
            const data = await api('/api/management-sim/terminations', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ persona_ids }) });
            run = data.run;
            await loadWeek();
            render();
          } catch (err) { document.getElementById('milestone-error').textContent = err.message; }
        };
      }
      const chooseBackfill = document.getElementById('choose-backfill');
      if (chooseBackfill) {
        chooseBackfill.onclick = async () => {
          try {
            const candidate_id = document.getElementById('backfill-choice').value || null;
            const data = await api('/api/management-sim/backfill', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ candidate_id }) });
            run = data.run;
            await loadWeek();
            render();
          } catch (err) { document.getElementById('milestone-error').textContent = err.message; }
        };
      }
      document.getElementById('assessment').onclick = async () => {
        try {
          const data = await api('/api/management-sim/assessment');
          const report = data.report;
          document.getElementById('assessment-output').innerHTML = `
            <div><strong>Person traits</strong> <span class="score">${report.person_traits.score}</span><br><span class="muted">${esc(report.person_traits.evidence.join(' '))}</span></div>
            <div style="height:10px"></div>
            <div><strong>Team dynamics</strong> <span class="score">${report.team_dynamics.score}</span><br><span class="muted">${esc(report.team_dynamics.evidence.join(' '))}</span></div>
            <div style="height:10px"></div>
            <div><strong>Product complications</strong> <span class="score">${report.product_complications.score}</span><br><span class="muted">${esc(report.product_complications.evidence.join(' '))}</span></div>
            <div style="height:10px"></div>
            <div><strong>Crisis outcomes</strong> <span class="score">${report.crisis_outcomes.score}</span><br><span class="muted">${esc(report.crisis_outcomes.evidence.join(' '))}</span></div>
            <div style="height:10px"></div>
            <div class="muted"><strong>Next move:</strong> ${esc(report.highest_value_next_move)}</div>`;
        } catch (err) { document.getElementById('assessment-output').textContent = err.message; }
      };
      document.getElementById('advance').onclick = async () => {
        try {
          const button = document.getElementById('advance');
          button.disabled = true;
          const data = await api('/api/management-sim/advance', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ expected_day:run.day }) });
          run = data.run;
          await loadWeek();
          render();
        } catch (err) { alert(err.message); document.getElementById('advance').disabled = false; }
      };
    }

    async function loadWeek() { week = await api('/api/management-sim/week'); }
    async function boot() {
      const data = await api('/api/management-sim/current');
      run = data.run;
      if (!run) return startView();
      await loadWeek();
      render();
    }
    boot().catch(err => { content.innerHTML = `<p class="error">${esc(err.message)}</p>`; });
  </script>
</body>
</html>
